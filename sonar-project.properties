sonar.organization=cruz-blanca-tech
sonar.projectKey=Cruz-Blanca-Tech_cruz-blanca-app
sonar.projectName=Cruz Blanca - Frontend App
sonar.projectVersion=0.2.0

# Código fuente y pruebas
sonar.sources=src
sonar.tests=src,e2e
sonar.test.inclusions=**/*.test.ts,e2e/**/*.ts

# Codificación
sonar.sourceEncoding=UTF-8

# Exclusiones (las pruebas se analizan como pruebas, no como código fuente)
sonar.exclusions=**/node_modules/**,**/.next/**,**/public/**,**/*.config.js,**/*.config.mjs,**/*.config.ts,**/*.test.ts
sonar.cpd.exclusions=**/*.tsx

# Cobertura de pruebas unitarias (Vitest + @vitest/coverage-v8)
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=**/*.tsx,src/app/**,**/hooks/**,**/services/**,**/stores/**,**/types/**,src/proxy.ts,src/shared/drive/**,**/correction-form.ts

# Ignorar reglas estilísticas de accesibilidad de click y promesas en UI legacy
sonar.issue.ignore.multicriteria=e1,e2
sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S1082
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*
sonar.issue.ignore.multicriteria.e2.ruleKey=typescript:S9383
sonar.issue.ignore.multicriteria.e2.resourceKey=**/*
