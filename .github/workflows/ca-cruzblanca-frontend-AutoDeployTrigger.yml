name: Deploy to Azure Container Apps (ca-cruzblanca-frontend)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # SonarQube necesita el historial para analizar el código nuevo

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'   # Igual que el Dockerfile
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Pruebas unitarias (Vitest + cobertura)
        run: npm run test:coverage

      - name: SonarQube Cloud Scan + Quality Gate
        # Falla si el Quality Gate no pasa; build-and-deploy tiene `needs: quality`.
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300

  e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Instalar navegador de Playwright
        run: npx playwright install --with-deps chromium

      - name: Build de la app
        run: npm run build

      - name: Pruebas E2E (Playwright)
        run: npm run test:e2e

      - name: Publicar reporte E2E
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  build-and-deploy:
    runs-on: ubuntu-latest
    needs: [quality, e2e]   # Quality gate: no se despliega si fallan typecheck, lint, pruebas unitarias, E2E o el Quality Gate de SonarQube
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Login al Azure Container Registry usando credenciales del registry
      - name: Login to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: cruzblanca2026.azurecr.io
          username: ${{ secrets.CACRUZBLANCABACKEND_REGISTRY_USERNAME }}
          password: ${{ secrets.CACRUZBLANCABACKEND_REGISTRY_PASSWORD }}

      # Setup Docker Buildx para builds optimizados
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build y push de la imagen al registry
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            cruzblanca2026.azurecr.io/ca-cruzblanca-frontend:${{ github.sha }}
            cruzblanca2026.azurecr.io/ca-cruzblanca-frontend:latest
          build-args: |
            NEXT_PUBLIC_BACKEND_BASE_URL=${{ secrets.NEXT_PUBLIC_BACKEND_BASE_URL }}
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
            NEXT_PUBLIC_GOOGLE_API_KEY=${{ secrets.NEXT_PUBLIC_GOOGLE_API_KEY }}
          cache-from: type=registry,ref=cruzblanca2026.azurecr.io/ca-cruzblanca-frontend:latest
          cache-to: type=inline

