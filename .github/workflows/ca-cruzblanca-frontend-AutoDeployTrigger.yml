name: Trigger auto deployment for ca-cruzblanca-frontend

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.CACRUZBLANCABACKEND_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.CACRUZBLANCABACKEND_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.CACRUZBLANCABACKEND_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          dockerfilePath: './Dockerfile'
          registryUrl: 'cruzblanca2026.azurecr.io'
          registryUsername: ${{ secrets.CACRUZBLANCABACKEND_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.CACRUZBLANCABACKEND_REGISTRY_PASSWORD }}
          containerAppName: ca-cruzblanca-frontend
          resourceGroup: rg-ocr-cruzblanca
          imageToBuild: cruzblanca2026.azurecr.io/ca-cruzblanca-frontend:${{ github.sha }}
