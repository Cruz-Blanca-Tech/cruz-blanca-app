name: Deploy to Azure Container Apps (ca-cruzblanca-frontend)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Login al Azure Container Registry usando credenciales del registry
      - name: Login to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: cruzblanca2026.azurecr.io
          username: ${{ secrets.CACRUZBLANCABACKEND_REGISTRY_USERNAME }}
          password: ${{ secrets.CACRUZBLANCABACKEND_REGISTRY_PASSWORD }}

      # Setup Docker Buildx para builds optimizados
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build y push de la imagen al registry
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            cruzblanca2026.azurecr.io/ca-cruzblanca-frontend:${{ github.sha }}
            cruzblanca2026.azurecr.io/ca-cruzblanca-frontend:latest
          build-args: |
            NEXT_PUBLIC_BACKEND_BASE_URL=${{ secrets.NEXT_PUBLIC_BACKEND_BASE_URL }}
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
            NEXT_PUBLIC_GOOGLE_API_KEY=${{ secrets.NEXT_PUBLIC_GOOGLE_API_KEY }}
          cache-from: type=registry,ref=cruzblanca2026.azurecr.io/ca-cruzblanca-frontend:latest
          cache-to: type=inline

